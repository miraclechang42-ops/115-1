<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖形小勇者：用手指畫圖形</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#1d2b53;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;background:#16204a}
h1{font-size:1.3rem;margin:0}#stars{font-size:1.5rem;letter-spacing:4px}
#stage{position:relative;width:min(96vw,125vh,960px);aspect-ratio:4/3;margin:12px 0;background:#000;border-radius:16px;overflow:hidden;border:4px solid #ffd23f}
#v,#c{position:absolute;inset:0;width:100%;height:100%}
#v{object-fit:fill;transform:scaleX(-1);opacity:.85}
#msg{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:1.25rem;font-weight:700;text-shadow:0 2px 4px #000}
#bar{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 8px}
.panel{position:absolute;inset:0;background:#1d2b53e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
button{font:inherit;font-size:1rem;font-weight:700;padding:9px 18px;border:0;border-radius:30px;background:#ffd23f;color:#222;cursor:pointer}
.dw{color:#fff;text-shadow:0 1px 3px #000;background:linear-gradient(90deg,#ffd23f var(--p,0%),#000a var(--p,0%))}
.alt{background:#fff3;color:#fff}
#qr{background:#fff;padding:10px;border-radius:12px}
#card h2{font-size:2.2rem;margin:0}#card p{font-size:1.2rem;line-height:1.7;max-width:36em;margin:0}
.big{font-size:4rem}
#cur{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:4px solid #fff;pointer-events:none;z-index:9;display:none}
.warn{color:#ffd23f}
#phone{padding:20px;text-align:center;display:none}
#phone video{width:70%;max-width:320px;border-radius:12px;transform:scaleX(-1)}
</style>
</head>
<body>
<div id="phone">
  <h2>📱 手機鏡頭</h2>
  <video id="pv" playsinline muted autoplay></video>
  <p id="pst">連線中…</p>
  <button id="flip">🔄 切換前／後鏡頭</button>
  <p>請把手機架好，鏡頭對著正在畫圖的同學，這個畫面請不要關閉。</p>
</div>
<div id="app" style="width:100%;display:flex;flex-direction:column;align-items:center">
<header><h1>✏️ 圖形小勇者</h1><div id="stars"></div></header>
<div id="stage">
  <video id="v" playsinline muted></video>
  <canvas id="c"></canvas>
  <div id="msg"></div>
  <div id="bar">
    <button class="dw" id="bPen"></button><button class="dw" id="bFin"></button>
    <button class="dw" id="bCol"></button><button class="dw" id="bMode"></button>
    <button class="dw" id="bClr">🧹 重畫</button>
  </div>
  <div class="panel" id="conn">
    <h2 style="margin:0">用手機當鏡頭</h2>
    <div id="qr"></div>
    <div>用手機掃描 QR Code，並允許使用相機</div>
    <div id="cst" style="opacity:.85">正在產生連結…</div>
    <div id="https" class="warn"></div>
    <div><button class="alt" id="useCam">改用電腦鏡頭</button> <button class="alt" id="useMouse">滑鼠練習模式</button></div>
  </div>
  <div class="panel" id="card" style="display:none"></div>
  <div id="cur"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const V=$('v'),C=$('c'),X=C.getContext('2d');
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},
 {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
 {urls:'turns:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]};
const circle=Array.from({length:72},(_,i)=>[Math.cos(i/72*6.2832-1.5708),Math.sin(i/72*6.2832-1.5708)]);
const SHAPES=[
 {n:'三角形',e:'🔺',poly:[[0,-1],[1,.85],[-1,.85]],dots:[0,1,2],t:'三角形有 3 條邊、3 個角。它是最穩固的圖形，所以鐵塔、屋頂和腳架都常用三角形。三個內角加起來剛好是 180 度喔！'},
 {n:'正方形',e:'🟦',poly:[[-.85,-.85],[.85,-.85],[.85,.85],[-.85,.85]],dots:[0,1,2,3],t:'正方形有 4 條一樣長的邊和 4 個直角。它的對邊互相平行，窗戶、棋盤、餐巾紙很多都是正方形。'},
 {n:'長方形',e:'📱',poly:[[-1.2,-.65],[1.2,-.65],[1.2,.65],[-1.2,.65]],dots:[0,1,2,3],t:'長方形有 4 個直角，對邊一樣長，但長和寬不一樣。課本、手機、黑板都是長方形。正方形是特別的長方形！'},
 {n:'圓形',e:'🟠',poly:circle,dots:[0,9,18,27,36,45,54,63],t:'圓形沒有角也沒有直直的邊，圓上每一點到圓心的距離都一樣長。車輪、時鐘、硬幣都是圓形，所以東西可以滾得很順！'}
];
const FING=[{n:'食指',i:8},{n:'中指',i:12},{n:'無名指',i:16},{n:'小指',i:20}];
const COLS=[['橘色','#ff9f1c'],['紅色','#ff3b5c'],['藍色','#3b82f6'],['紫色','#c77dff'],['青色','#00e5ff'],['白色','#ffffff']];
const MODES=['捏合落筆','按鈕切換','一直畫'];
let W,H,S,tol,lvl=0,trail=[],samples=[],lit=[],done=false,cur=null,running=false,mouse=false;
let fi=0,ci=0,mi=0,pen=false,prevPen=false,rat=null,pc=0,jump=0;
/* One Euro Filter：慢速時強力防抖、快速時低延遲 */
const LP=(a,x,p)=>p==null?x:a*x+(1-a)*p;
function mkF(mc=1.5,beta=.04,dc=1){let px=null,dx=null,t0=0,pf=null;
  const al=(c,dt)=>1/(1+1/(2*Math.PI*c)/dt);
  return{reset(){px=null;dx=null;pf=null},f(x,t){
    if(px==null){px=x;pf=x;t0=t;return x}
    const dt=Math.max((t-t0)/1000,.001);t0=t;const d=(x-px)/dt;px=x;
    dx=LP(al(dc,dt),d,dx);pf=LP(al(mc+beta*Math.abs(dx),dt),x,pf);return pf}}}
const FX=mkF(),FY=mkF();

function updUI(){
  $('bPen').textContent=pen?'✏️ 落筆中':'✋ 提筆中';
  $('bFin').textContent='☝️ '+FING[fi].n;
  $('bCol').innerHTML=`🎨 <span style="color:${COLS[ci][1]}">●</span> ${COLS[ci][0]}`;
  $('bMode').textContent='🔧 '+MODES[mi];
}
$('bPen').onclick=()=>{if(mi===1){pen=!pen;updUI()}};
$('bFin').onclick=()=>{fi=(fi+1)%FING.length;updUI()};
$('bCol').onclick=()=>{ci=(ci+1)%COLS.length;updUI()};
$('bMode').onclick=()=>{mi=(mi+1)%MODES.length;pen=mi===2;updUI()};
$('bClr').onclick=()=>{trail=[];lit=samples.map(()=>false);done=false;$('card').style.display='none'};

function sample(poly){
  const p=poly.concat([poly[0]]),seg=[];let tot=0;
  for(let i=0;i<p.length-1;i++){const d=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);seg.push(d);tot+=d}
  const out=[];
  for(let k=0;k<90;k++){let d=k/90*tot,i=0;while(d>seg[i]){d-=seg[i];i++}
    const f=d/seg[i];out.push([p[i][0]+(p[i+1][0]-p[i][0])*f,p[i][1]+(p[i+1][1]-p[i][1])*f])}
  return out;
}
function layout(){
  W=C.width=C.clientWidth;H=C.height=C.clientHeight;S=Math.min(W,H)*.34;tol=S*.2;
  const P=([x,y])=>({x:W/2+x*S,y:H*.47+y*S}),sh=SHAPES[lvl];
  sh.px=sh.poly.map(P);samples=sample(sh.poly).map(P);
  if(lit.length!==samples.length)lit=samples.map(()=>false);
}
function loadLevel(){trail=[];lit=[];done=false;layout();$('card').style.display='none';
  $('msg').textContent=`第 ${lvl+1} 關：沿著虛線畫出「${SHAPES[lvl].n}」，從 ★ 起點出發！`;
  $('stars').textContent='⭐'.repeat(lvl)+'☆'.repeat(SHAPES.length-lvl);updUI()}
function add(x,y){
  if(done)return;
  const pr=trail.length?trail[trail.length-1]:null,c=COLS[ci][1];
  if(pr){const n=Math.ceil(Math.hypot(x-pr.x,y-pr.y)/(tol*.5));
    for(let k=1;k<n;k++)trail.push({x:pr.x+(x-pr.x)*k/n,y:pr.y+(y-pr.y)*k/n,c})}
  trail.push({x,y,c});
  for(let k=Math.max(0,trail.length-40);k<trail.length;k++){const q=trail[k];if(!q)continue;
    samples.forEach((s,i)=>{if(!lit[i]&&Math.hypot(s.x-q.x,s.y-q.y)<tol)lit[i]=true})}
  const pts=trail.filter(Boolean);
  if(pts.length>90){
    const ok=pts.filter(p=>samples.some(s=>Math.hypot(s.x-p.x,s.y-p.y)<tol*1.5)).length/pts.length;
    if(ok<.5){$('msg').textContent='💡 要跟著虛線畫喔，我們重來一次！';trail=[];lit=samples.map(()=>false);return}
  }
  if(lit.filter(Boolean).length/samples.length>=.92)finish();
}
function finish(){
  done=true;const sh=SHAPES[lvl],last=lvl===SHAPES.length-1;
  $('stars').textContent='⭐'.repeat(lvl+1)+'☆'.repeat(SHAPES.length-lvl-1);
  const c=$('card');
  c.innerHTML=`<div class="big">${sh.e}</div><h2>🎉 過關！這是${sh.n}</h2><p>${sh.t}</p>
   <button class="dw" id="nx" style="font-size:1.3rem">${last?'🏆 全部完成，再玩一次':'下一關 ➜'}（手指停在這裡）</button>`;
  c.style.display='flex';
  $('nx').onclick=()=>{lvl=last?0:lvl+1;loadLevel()};
}
function draw(){
  X.clearRect(0,0,W,H);const sh=SHAPES[lvl];
  X.lineCap='round';X.lineJoin='round';
  X.beginPath();sh.px.forEach((p,i)=>i?X.lineTo(p.x,p.y):X.moveTo(p.x,p.y));X.closePath();
  X.setLineDash([16,14]);X.strokeStyle='#fff';X.lineWidth=5;X.stroke();X.setLineDash([]);
  samples.forEach((s,i)=>{if(lit[i]){X.fillStyle='#3ddc84';X.beginPath();X.arc(s.x,s.y,7,0,7);X.fill()}});
  sh.dots.forEach((d,i)=>{const p=sh.px[d];X.fillStyle=i?'#ff5d8f':'#ffd23f';X.beginPath();X.arc(p.x,p.y,15,0,7);X.fill();
    X.fillStyle='#222';X.font='bold 18px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText(i?i+1:'★',p.x,p.y+1)});
  X.lineWidth=9;
  for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];if(!a||!b)continue;
    X.strokeStyle=b.c;X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke()}
  requestAnimationFrame(draw);
}
/* 停留 1 秒觸發按鈕（不用滑鼠） */
let dw=null,dwT=0,cool=false;
function dwell(x,y){
  const st=$('stage').getBoundingClientRect(),k=st.width/W,px=st.left+x*k,py=st.top+y*k;
  const sel=$('card').style.display==='flex'?'#card .dw':'#bar .dw';
  let hit=null;
  document.querySelectorAll(sel).forEach(e=>{const r=e.getBoundingClientRect();
    if(px>r.left-10&&px<r.right+10&&py>r.top-10&&py<r.bottom+10)hit=e});
  const now=performance.now();
  if(hit!==dw){if(dw)dw.style.setProperty('--p','0%');dw=hit;dwT=now;cool=false}
  if(dw&&!cool){const p=(now-dwT)/1000;dw.style.setProperty('--p',Math.min(p,1)*100+'%');
    if(p>=1){cool=true;dw.click();dw.style.setProperty('--p','0%')}}
  return !!hit;
}
function showCur(){const el=$('cur');if(!cur){el.style.display='none';return}
  el.style.display='block';el.style.left=cur.x/W*100+'%';el.style.top=cur.y/H*100+'%';
  el.style.background=pen?COLS[ci][1]:'transparent';el.style.borderColor=pen?'#fff':COLS[ci][1]}
function step(x,y,t){
  const nx=FX.f(x,t),ny=FY.f(y,t);
  if(cur&&Math.hypot(nx-cur.x,ny-cur.y)>W*.25&&++jump<4)return; /* 忽略突然亂跳的點 */
  jump=0;cur={x:nx,y:ny};
  const over=dwell(cur.x,cur.y),down=pen&&!over&&!done;
  if(down)add(cur.x,cur.y);else if(prevPen)trail.push(null);
  prevPen=down;showCur();updUI();
}
/* 手部追蹤 */
let hands;
function startTracking(){
  if(running)return;running=true;$('conn').style.display='none';loadLevel();
  V.play().catch(()=>{});
  hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.7,minTrackingConfidence:.6});
  hands.onResults(r=>{
    const l=r.multiHandLandmarks&&r.multiHandLandmarks[0];
    if(!l){if(prevPen){trail.push(null);prevPen=false}cur=null;FX.reset();FY.reset();pc=0;showCur();return}
    const vw=V.videoWidth||640,vh=V.videoHeight||480,a=l[4],b=l[FING[fi].i];
    const dist=(p,q)=>Math.hypot((p.x-q.x)*vw,(p.y-q.y)*vh);
    const raw=dist(a,b)/dist(l[0],l[9]);
    rat=rat==null?raw:rat*.5+raw*.5;
    if(mi===0){ /* 連續 3 格畫面都符合才切換，避免誤判 */
      if(!pen&&rat<.28){if(++pc>=3){pen=true;pc=0}}
      else if(pen&&rat>.45){if(++pc>=3){pen=false;pc=0}}
      else pc=0;
    }
    step((1-b.x)*W,b.y*H,performance.now()); /* 筆尖 = 所選手指的指尖 */
  });
  (async function loop(){if(V.readyState>=2)await hands.send({image:V});requestAnimationFrame(loop)})();
}
function startMouse(){
  mouse=true;$('conn').style.display='none';V.style.display='none';loadLevel();
  const pos=e=>{const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
  let dn=false;C.onpointerdown=e=>{dn=true;const p=pos(e);add(p.x,p.y)};
  C.onpointermove=e=>{if(dn){const p=pos(e);add(p.x,p.y)}};
  C.onpointerup=()=>{dn=false;trail.push(null)};
}
$('useMouse').onclick=startMouse;
$('useCam').onclick=async()=>{
  try{V.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});startTracking()}
  catch(e){$('cst').textContent='無法開啟電腦鏡頭：請確認使用 https 網址並允許相機權限'}
};
/* 手機 → 電腦（WebRTC） */
const camId=new URLSearchParams(location.search).get('cam');
const secure=window.isSecureContext;
if(camId){
  $('app').style.display='none';$('phone').style.display='block';
  let face='user',stream,call,peer;
  const get=()=>navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face},width:{ideal:640},height:{ideal:480}},audio:false});
  const say=t=>$('pst').textContent=t;
  if(!secure||!navigator.mediaDevices){say('❌ 這個網址不是 https，手機瀏覽器不允許開相機。請把網頁放到 https 網站（例如 GitHub Pages）。')}
  else get().then(s=>{
    stream=s;$('pv').srcObject=s;say('📡 正在連到電腦…');
    peer=new Peer({config:ICE});
    peer.on('open',()=>{call=peer.call(camId,stream);
      call.on('error',e=>say('連線失敗：'+e));call.on('close',()=>say('連線已中斷，請重新掃描 QR Code'));
      setTimeout(()=>{if(call.peerConnection&&call.peerConnection.connectionState==='connected')say('✅ 已把畫面傳到電腦')},2500);
      call.peerConnection&&call.peerConnection.addEventListener('connectionstatechange',()=>{
        const st=call.peerConnection.connectionState;
        if(st==='connected')say('✅ 已把畫面傳到電腦');if(st==='failed')say('❌ 網路連線失敗，請讓手機和電腦連同一個 Wi-Fi 再試一次')})});
    peer.on('error',e=>say('連線失敗（'+e.type+'）：請確認電腦的網頁還開著，然後重新掃描 QR Code'));
    if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});
  }).catch(e=>say('❌ 無法開啟相機（'+e.name+'）：請到瀏覽器設定允許相機，並關閉其他使用相機的程式'));
  $('flip').onclick=async()=>{if(!stream)return;face=face==='user'?'environment':'user';
    try{const n=await get();$('pv').srcObject=n;
      const snd=call&&call.peerConnection.getSenders().find(s=>s.track&&s.track.kind==='video');
      if(snd)await snd.replaceTrack(n.getVideoTracks()[0]);stream.getTracks().forEach(t=>t.stop());stream=n}catch(e){say('無法切換鏡頭')}};
}else{
  layout();window.addEventListener('resize',()=>{lit=[];layout()});updUI();
  requestAnimationFrame(draw);
  if(!secure)$('https').textContent='⚠️ 目前不是 https 網址，手機將無法開啟相機。請把網頁放到 https 網站。';
  const peer=new Peer({config:ICE});
  peer.on('open',id=>{
    new QRCode($('qr'),{text:location.origin+location.pathname+'?cam='+id,width:200,height:200});
    $('cst').textContent='等待手機連線…';
  });
  peer.on('call',call=>{
    $('cst').textContent='📱 手機已連線，接收畫面中…';call.answer();
    call.on('stream',s=>{V.srcObject=s;startTracking()});
    setTimeout(()=>{if(!running)$('cst').textContent='⚠️ 收不到手機畫面：請確認兩台裝置網路正常，再重新掃描 QR Code'},12000);
  });
  peer.on('disconnected',()=>peer.reconnect());
  peer.on('error',e=>$('cst').textContent='連線服務發生問題（'+e.type+'），請重新整理網頁');
}
</script>
</body>
</html>
